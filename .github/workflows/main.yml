name: Build and validate CloudX
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Reuse the hosted SDK; newer command-line tools need Java 21.
          JAVA_HOME="$JAVA_HOME_21_X64" "$sdkmanager" 'platforms;android-34' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test session and controller bridge
        run: node --test tests/*.test.cjs
      - name: Test, lint and build
        run: ./gradlew --no-daemon --no-configuration-cache --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Sign verified ARM artifacts
        if: github.event_name != 'pull_request'
        env:
          CLOUDX_KEYSTORE_BASE64: ${{ secrets.CLOUDX_KEYSTORE_BASE64 }}
          CLOUDX_KEY_ALIAS: ${{ secrets.CLOUDX_KEY_ALIAS }}
          CLOUDX_STORE_PASSWORD: ${{ secrets.CLOUDX_STORE_PASSWORD }}
          CLOUDX_KEY_PASSWORD: ${{ secrets.CLOUDX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for required_secret in CLOUDX_KEYSTORE_BASE64 CLOUDX_KEY_ALIAS CLOUDX_STORE_PASSWORD CLOUDX_KEY_PASSWORD; do
            if [[ -z "${!required_secret}" ]]; then
              echo "::error::Missing repository secret: $required_secret"
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi
          export CLOUDX_KEYSTORE="$RUNNER_TEMP/cloudx-signing.jks"
          trap 'rm -f "$CLOUDX_KEYSTORE"' EXIT
          printf '%s' "$CLOUDX_KEYSTORE_BASE64" | base64 --decode > "$CLOUDX_KEYSTORE"
          bash scripts/package-apks.sh
          git rev-parse HEAD > dist_apks/COMMIT
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: CloudX-AndroidTV-ARM
          path: dist_apks/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/build/reports/**/*') != ''
        with:
          name: validation-reports
          path: app/build/reports/
          if-no-files-found: error
