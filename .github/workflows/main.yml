name: Build and validate CloudX
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: ./gradlew --no-daemon --no-configuration-cache --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Sign verified ARM artifacts
        if: github.event_name != 'pull_request'
        env:
          CLOUDX_KEYSTORE_BASE64: ${{ secrets.CLOUDX_KEYSTORE_BASE64 }}
          CLOUDX_KEY_ALIAS: ${{ secrets.CLOUDX_KEY_ALIAS }}
          CLOUDX_STORE_PASSWORD: ${{ secrets.CLOUDX_STORE_PASSWORD }}
          CLOUDX_KEY_PASSWORD: ${{ secrets.CLOUDX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CLOUDX_KEYSTORE_BASE64:?Configure persistent signing secrets}"
          export CLOUDX_KEYSTORE="$RUNNER_TEMP/cloudx-signing.jks"
          trap 'rm -f "$CLOUDX_KEYSTORE"' EXIT
          printf '%s' "$CLOUDX_KEYSTORE_BASE64" | base64 --decode > "$CLOUDX_KEYSTORE"
          bash scripts/package-apks.sh
          git rev-parse HEAD > dist_apks/COMMIT
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: CloudX-AndroidTV-ARM
          path: dist_apks/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
          if-no-files-found: error
